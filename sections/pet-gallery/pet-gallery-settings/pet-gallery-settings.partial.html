<div class="pet-gallery-settings">
    <h3>Pet Gallery Settings</h3>
    <p>Configure the settings for the pet gallery below.</p>

    <label for="gallery-breed-select">Pet Breed:</label>
    <select id="gallery-breed-select" name="gallery-breed">
        <option value="any" selected>Any</option>
    </select>

    <label for="gallery-sort-select">Sort Direction:</label>
    <select id="gallery-sort-select" name="gallery-sort">
        <option value="rand" selected>Random</option>
        <option value="asc">Ascending</option>
        <option value="desc">Descending</option>
    </select>
</div>
