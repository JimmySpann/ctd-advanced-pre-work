<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Cats</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <site-header></site-header>
    <main>
        <section id="intro">
            <h1>Welcome to Our Cat Site</h1>
            <p>Discover the wonderful world of cats!</p>
        </section>

        <section id="gallery">
            <h2>Cat Gallery</h2>

            <div class="cat-gallery-settings">

            </div>

            <div class="cat-gallery-list">
                <div class="card">
                    <img src="https://static.vecteezy.com/system/resources/thumbnails/050/393/628/small/cute-curious-gray-and-white-kitten-in-a-long-shot-photo.jpg"
                        alt="Cat 1">
                    <h3>Fluffy</h3>
                    <p>A playful kitten who loves to chase yarn.</p>
                </div>
                <div class="card">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQBEA2rPU99lt1Fg43YFICe_HxDgk0CRI1rMnNOGChg1Y7Av--9OtIK2KrN&s=10"
                        alt="Cat 2">
                    <h3>Whiskers</h3>
                    <p>A curious cat who enjoys exploring new places.</p>
                </div>
                <div class="card">
                    <img src="https://media.istockphoto.com/id/623368750/photo/sacred-birma-cat-in-interior.jpg?s=612x612&w=0&k=20&c=KfNi_sRwTCtXTnnUvEYVBnRg9arrA3JBC7SppRtSRzs="
                        alt="Cat 3">
                    <h3>Mittens</h3>
                    <p>A gentle cat who loves to cuddle and be petted.</p>
                </div>
            </div>

        </section>
    </main>

    <site-footer></site-footer>

    <script src="index.js"></script>
    <script src="components/header/header.js"></script>
    <script src="components/footer/footer.js"></script>
